services:
  weather-calendar:
    build: .
    image: weather-calendar:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      GOOGLE_WEATHER_API_KEY: ${GOOGLE_WEATHER_API_KEY:?Export GOOGLE_WEATHER_API_KEY before starting Compose}
      LOCATION_LATITUDE: ${LOCATION_LATITUDE:-50.0647}
      LOCATION_LONGITUDE: ${LOCATION_LONGITUDE:-19.9450}
      DATABASE_PATH: /data/weather.sqlite3
      PORT: 8080
    volumes:
      - weather-data:/data

volumes:
  weather-data:
